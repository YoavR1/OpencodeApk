org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately OFF for now. It interacts poorly with some
# AGP 8.x lint/test task graphs and cannot be validated from a cloud session
# (no Android SDK). Enable it once CI can prove the whole task graph stays green.
org.gradle.configuration-cache=false

android.useAndroidX=true
# android.nonTransitiveRClass is not set: AGP 9 removed the flag and the
# non-transitive behaviour is always on.

kotlin.code.style=official
