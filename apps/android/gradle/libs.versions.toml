# Versions are pinned deliberately. See docs/DECISIONS.md ADR-0011.
#
# AGP 9.x is required, not merely preferred: androidx.core 1.19.0 declares
# "requires Android Gradle plugin 9.1.0 or higher" and "compile against version 37
# or later" in its AAR metadata, and the build fails at CheckAarMetadata otherwise.
# The first CI run proved this. See ADR-0011 for the correction.
#
# compileSdk 37 / targetSdk 36 is deliberate: compiling against the newer API is
# what androidx demands, while targetSdk governs runtime behaviour changes this
# project has not tested against. Google's own guidance separates the two.

[versions]
agp = "9.3.1"

coreKtx = "1.19.0"
appcompat = "1.8.0"
activity = "1.13.0"
webkit = "1.17.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"

junit = "4.13.2"
robolectric = "4.16.1"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
# lifecycleScope, used to run bridge handlers with the Activity's lifetime.
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Dispatchers.IO, so disk-touching bridge handlers stay off the main thread.
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Robolectric runs the JVM tests against real Android classes - SharedPreferences,
# JSONObject, Base64 - rather than mocking the platform away and testing nothing.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No Kotlin plugin entry: AGP 9 provides Kotlin support itself.
