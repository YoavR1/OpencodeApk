# Versions are pinned deliberately. See docs/DECISIONS.md ADR-0011.
#
# AGP 8.13.2 + Gradle 8.14.3 is chosen over the AGP 9.x line: 9.x carries DSL
# changes that cannot be validated from a cloud session (no Android SDK), and a
# green CI build is an M2 acceptance criterion. Revisit once CI can prove it.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"

coreKtx = "1.19.0"
appcompat = "1.8.0"
activity = "1.13.0"
webkit = "1.17.0"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
